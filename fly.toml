# fly.toml app configuration file generated for pdf-library-vivid-meadow-4952 on 2026-05-04T21:06:13-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pdf-library-vivid-meadow-4952'
primary_region = 'dfw'

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "pdf_library_data"
  destination = "/app/local-files"
  initial_size = "10gb"
